<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/quarto_cadastrar.js" defer></script>
    <title>Cadastrar Quarto</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Quartos</span>&emsp;
            <a href="./quarto_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./quarto_listar.html">Listar</a>&emsp;
            <a href="./quarto_consultar.html">Consultar</a>&emsp;
            <a href="./quarto_atualizar.html">Atualizar</a>&emsp;
            <a href="./quarto_apagar.html">Apagar</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Novo Quarto</h1>
        <br><br>
        <form>
            <label for="numero">Número do Quarto</label><br>
            <input type="number" id="numero" required><br><br>

            <label for="diasHospedagem">Dias de Hospedagem</label><br>
            <input type="number" id="diasHospedagem" required><br><br>

            <label for="valorDiaria">Valor da Diária (R$)</label><br>
            <input type="number" step="0.01" id="valorDiaria" required><br><br>

            <label for="idHospede">Código do Hóspede</label><br>
            <input type="number" id="idHospede" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button><br><br><br>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/hospede_cadastrar.js" defer></script>
    <title>Cadastrar Hóspede</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Hóspedes</span>&emsp;
            <a href="./hospede_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./hospede_listar.html">Listar</a>&emsp;
            <a href="./hospede_consultar.html">Consultar</a>&emsp;
            <a href="./hospede_atualizar.html">Atualizar</a>&emsp;
            <a href="./hospede_apagar.html">Apagar</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Novo Hóspede</h1>
        <br><br>
        <form>
            <label for="nome">Nome do Hóspede</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf" required><br><br>

            <label for="email">E-mail</label><br>
            <input type="email" id="email" required><br><br>

            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button><br><br><br>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
